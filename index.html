<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario Universitario</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

  <header>
    <h1>⬡ HORARIO UNIVERSITARIO</h1>
    <span>IINE · drag & drop</span>
    <div class="period-selector-wrap" style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
      <a href="https://github.com/Jrgil20/PerspectivaHoraria" target="_blank" rel="noopener noreferrer" class="github-star-btn" title="Dar una estrella en GitHub">
        <span class="star-icon">★</span>
        <span class="github-text">Star on GitHub</span>
      </a>
      <label for="period-select" style="font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--text-dim);">PERÍODO:</label>
      <select id="period-select" class="period-select" onchange="changePeriod(this.value)"></select>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">
        <span>// secciones disponibles</span>
        <div class="sort-toggle">
          <button class="sort-btn active" id="btn-sort-alpha" onclick="setSortMode('alpha')" title="Orden Alfabético (A)">A</button>
          <button class="sort-btn" id="btn-sort-sem" onclick="setSortMode('semester')" title="Por Semestre (S)">S</button>
        </div>
      </div>
      <div id="sidebar-content"></div>
    </div>

    <div class="schedule-container">
      <div class="schedule-header">
        <h2>// horario consolidado</h2>
        <button class="clear-btn" onclick="copyNRCs()" style="border-color: var(--cyan); color: var(--cyan);">⎘ COPIAR
          NRCs</button>
        <button class="clear-btn" onclick="clearAll()">⟳ LIMPIAR TODO</button>
      </div>

      <div class="stats-bar" id="stats-bar">
        <div class="stat-chip">Materias colocadas: <span class="val" id="stat-placed">0</span></div>
        <div class="stat-chip">Horas semanales: <span class="val" id="stat-hours">0</span></div>
        <div class="stat-chip" id="stat-conflict" style="border-color: var(--accent2); display:none;">⚠ CONFLICTO
          DETECTADO</div>
      </div>

      <div class="grid-wrap">
        <div class="grid-table" id="grid-table"></div>
      </div>

      <p style="font-family:'Space Mono',monospace;font-size:0.62rem;color:var(--text-dim);margin-top:12px;">
        💡 tip: arrastra o haz click/tap en materias para agregarlas · click en un bloque colocado para eliminarlo
      </p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="scripts/config.js"></script>
  <script src="scripts/periods.js"></script>
  <script src="scripts/sidebar.js"></script>
  <script src="scripts/schedule.js"></script>
  <script src="scripts/app.js"></script>
</body>

</html>
